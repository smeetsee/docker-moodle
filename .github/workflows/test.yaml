name: Test
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

jobs:
  renovate-config-validator:
    # This job is based on https://github.com/renovatebot/github-action/blob/700f3b59b9d0fc6dffce45b564ee1f58869973b1/.github/workflows/build.yml#L132-L148
    name: Validate Renovate config
    if: github.event.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    container:
      image: ghcr.io/renovatebot/renovate:44.222.0@sha256:a8cb8222b49d15da701436954b7463427d535eae2203b294655c9a29675c47d1
      # github hosted runners are running as `1001:127` (ubuntu:docker)
      options: -u 1001:0 --group-add 1000 --group-add 12021 --group-add 127

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Validate Renovate configuration
        run: |
          renovate-config-validator .github/renovate.json

  zizmor:
    runs-on: ubuntu-slim
    permissions:
      security-events: write
      contents: read # only needed for private or internal repos
      actions: read # only needed for private or internal repos
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
